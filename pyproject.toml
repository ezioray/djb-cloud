[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djb-cloud"
version = "0.1.0"
description = "DJB 云端最小骨架：双签收据 -> 只追加账本 -> 可复算"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pyyaml>=6"]   # tests/test_spec_contract.py 直接 import yaml

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
